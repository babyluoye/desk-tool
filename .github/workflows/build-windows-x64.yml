name: Build Windows x64

on:
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest

    env:
      RUST_TARGET: x86_64-pc-windows-msvc
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        shell: pwsh
        run: |
          $rustup = Get-Command rustup -ErrorAction SilentlyContinue
          if (-not $rustup) {
            $installer = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
            Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile $installer
            & $installer -y --default-toolchain stable --profile minimal
            $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          }
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add $env:RUST_TARGET
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install

      - name: Generate Windows application icon
        shell: pwsh
        run: ./scripts/generate-icon.ps1

      - name: Build Tauri Windows bundle
        shell: pwsh
        run: npm run tauri -- build --target $env:RUST_TARGET

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: newapi-desk-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/${{ env.RUST_TARGET }}/release/bundle/msi/*.msi
            src-tauri/target/${{ env.RUST_TARGET }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ env.RUST_TARGET }}/release/newapi-token-manager.exe
