name: Build Windows x64

on:
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      RUST_TARGET: x86_64-pc-windows-msvc
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        shell: pwsh
        run: |
          $rustup = Get-Command rustup -ErrorAction SilentlyContinue
          if (-not $rustup) {
            $installer = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
            Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile $installer
            & $installer -y --default-toolchain stable --profile minimal
            $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          }
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add $env:RUST_TARGET
          rustc --version
          cargo --version

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-x64-msvc

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci

      - name: Generate Windows application icon
        shell: pwsh
        run: ./scripts/generate-icon.ps1

      - name: Generate unique release version
        id: release-version
        uses: actions/github-script@v7
        with:
          script: |
            const format = (date) => {
              const year = date.getUTCFullYear();
              const monthDay = `${String(date.getUTCMonth() + 1).padStart(2, "0")}${String(date.getUTCDate()).padStart(2, "0")}`;
              const hourMinute = `${String(date.getUTCHours()).padStart(2, "0")}${String(date.getUTCMinutes()).padStart(2, "0")}`;
              const month = date.getUTCMonth() + 1;
              const day = date.getUTCDate();
              const minutesOfDay = date.getUTCHours() * 60 + date.getUTCMinutes();
              const patch = (day - 1) * 1440 + minutesOfDay;
              return {
                tag: `V${year}-${monthDay}-${hourMinute}`,
                appVersion: `${year - 2020}.${month}.${patch}`,
              };
            };
            const waitForNextMinute = async (tag) => {
              const now = new Date();
              const waitMs = 60000 - (now.getUTCSeconds() * 1000 + now.getUTCMilliseconds()) + 150;
              core.info(`Git tag ${tag} is already reserved; waiting for the next UTC minute.`);
              await new Promise((resolve) => setTimeout(resolve, waitMs));
            };

            let version = format(new Date());
            while (true) {
              try {
                await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${version.tag}`,
                });
                await waitForNextMinute(version.tag);
                version = format(new Date());
                continue;
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              const tagObject = await github.rest.git.createTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: version.tag,
                message: `DeskTool ${version.tag}`,
                object: context.sha,
                type: "commit",
              });
              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${version.tag}`,
                  sha: tagObject.data.sha,
                });
                break;
              } catch (error) {
                if (error.status !== 422) throw error;
                await waitForNextMinute(version.tag);
                version = format(new Date());
              }
            }
            core.setOutput("tag", version.tag);
            core.setOutput("app_version", version.appVersion);
            core.info(`Building DeskTool ${version.tag} (Windows package version ${version.appVersion})`);

      - name: Set Windows package version
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.release-version.outputs.app_version }}
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          $json = Get-Content $configPath -Raw
          $updated = [regex]::Replace($json, '"version":\s*"0\.1\.0"', ('"version": "' + $env:APP_VERSION + '"'))
          if ($updated -eq $json) { throw "Could not update the Tauri package version." }
          Set-Content -Path $configPath -Value $updated -Encoding utf8

      - name: Build Tauri Windows bundle
        shell: pwsh
        run: npm run tauri -- build --target $env:RUST_TARGET

      - name: Prepare DeskTool release assets
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/$env:RUST_TARGET/release"
          $releaseDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $app = Join-Path $bundle "desk-tool.exe"
          if (-not (Test-Path $app)) { throw "DeskTool executable was not produced: $app" }
          Copy-Item $app (Join-Path $releaseDir "DeskTool.exe")

          $msi = @(Get-ChildItem (Join-Path $bundle "bundle/msi/*.msi") -ErrorAction SilentlyContinue)
          $nsis = @(Get-ChildItem (Join-Path $bundle "bundle/nsis/*.exe") -ErrorAction SilentlyContinue)
          if ($msi.Count -ne 1) { throw "Expected exactly one MSI installer, found $($msi.Count)." }
          if ($nsis.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($nsis.Count)." }
          Copy-Item $msi[0].FullName (Join-Path $releaseDir "DeskTool-Installer.msi")
          Copy-Item $nsis[0].FullName (Join-Path $releaseDir "DeskTool-Setup.exe")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-version.outputs.tag }}
          name: ${{ steps.release-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
